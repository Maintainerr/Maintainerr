name: Weblate review

# Weblate opens a pull request for every batch of translations. This labels it
# and posts a back-translation table so the whole review happens on GitHub.
#
# pull_request_target runs this workflow (and the tools/ it executes) from the
# BASE branch, and the back-translation step holds the AI key and a PR-write
# token. A pull request must therefore never have its code executed here: the
# steps below check out the base, then overlay ONLY the pull request's *.po
# files as data. Nothing from the pull request head is ever run.
on:
  pull_request_target:
    branches: [development]
    paths:
      - 'apps/ui/src/locales/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: weblate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Back-translation review
    runs-on: ubuntu-latest
    steps:
      # Labels and the review comment come from the bot rather than
      # github-actions, matching the rest of the repo's automation.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_KEY }}

      # pull_request_target checks out the BASE by default, so tools/ and the
      # workflow are trusted. fetch-depth 0 gives the back-translate step the
      # base commit it diffs against.
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The catalogs are DATA under review, never code. Checking the head out
      # - with actions/checkout or git - is the pattern CodeQL flags in a
      # privileged workflow, and it is more than this job needs. Download the
      # blobs through the API instead: no untrusted ref is ever checked out, so
      # there is nothing on disk for a later step to execute, and a non-catalog
      # file under that path fails the job.
      - name: Download the pull request's catalogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed")
                      | select(.filename | startswith("apps/ui/src/locales/"))
                      | .filename')"
          for f in $changed; do
            # `*` in a case pattern matches slashes too, so the prefix alone
            # would still admit a traversal. Git cannot store a '..' component,
            # but this job is privileged - spell the rejection out.
            case "$f" in
              *..*)
                echo "::error title=Unexpected path::Path traversal in catalog name: $f"
                exit 1
                ;;
              apps/ui/src/locales/*.po) ;;
              *)
                echo "::error title=Unexpected file::Only .po files may live under apps/ui/src/locales: $f"
                exit 1
                ;;
            esac
            gh api "repos/$REPO/contents/$f?ref=$HEAD_SHA" --jq '.content' \
              | base64 -d > "$f"
            # The contents API returns an empty body for blobs over 1MB. Without
            # this the job would review an empty catalog and report no changes.
            if [ ! -s "$f" ]; then
              echo "::error title=Empty catalog::$f downloaded empty - too large for the contents API?"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Label the pull request
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request
            const fromWeblate =
              pr.user.login.startsWith('hosted-weblate') ||
              pr.head.ref.startsWith('weblate-')
            const labels = fromWeblate ? ['l10n', 'do-not-squash'] : ['l10n']
            for (const name of labels) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              }).catch(() => {})
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels,
            })

      - name: Back-translate changed strings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL_API_KEY: ${{ secrets.AI_MODEL_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          node tools/i18n/back-translate.mjs \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --out .i18n-review.md

      - name: Append to step summary
        run: cat .i18n-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing sticky comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- maintainerr-i18n-back-translation -->'
          token: ${{ steps.app-token.outputs.token }}

      - name: Upsert review comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: .i18n-review.md
          edit-mode: replace
          token: ${{ steps.app-token.outputs.token }}
