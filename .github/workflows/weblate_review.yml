name: Weblate review

# Weblate opens a pull request for every batch of translations. This labels it
# and posts a back-translation table so the whole review happens on GitHub.
on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/ui/src/locales/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: weblate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Back-translation review
    runs-on: ubuntu-latest
    steps:
      # Labels and the review comment come from the bot rather than
      # github-actions, matching the rest of the repo's automation.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needs the base commit so only changed translations are reviewed.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Label the pull request
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request
            const fromWeblate =
              pr.user.login.startsWith('hosted-weblate') ||
              pr.head.ref.startsWith('weblate-')
            const labels = fromWeblate ? ['i18n', 'do-not-squash'] : ['i18n']
            for (const name of labels) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              }).catch(() => {})
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels,
            })

      # Squash and rebase both rewrite commit SHAs, after which Weblate no
      # longer recognises its own commits upstream and every later sync
      # conflicts. Auto-merge pins the method so nobody has to remember.
      - name: Pin Weblate pull requests to a merge commit
        if: >-
          startsWith(github.event.pull_request.user.login, 'hosted-weblate') ||
          startsWith(github.event.pull_request.head.ref, 'weblate-')
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            try {
              await github.graphql(
                `mutation($id: ID!) {
                   enablePullRequestAutoMerge(
                     input: { pullRequestId: $id, mergeMethod: MERGE }
                   ) { clientMutationId }
                 }`,
                { id: context.payload.pull_request.node_id },
              )
              core.info('Auto-merge enabled with a merge commit.')
            } catch (error) {
              core.warning(
                'Could not pin auto-merge to a merge commit: ' +
                  error.message +
                  '. Merge commits must be enabled on the repository ' +
                  '(Settings -> General -> Allow merge commits). ' +
                  'Until then, do NOT squash this pull request.',
              )
            }

      - name: Back-translate changed strings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL_API_KEY: ${{ secrets.AI_MODEL_API_KEY }}
        run: |
          node tools/i18n/back-translate.mjs \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --out .i18n-review.md

      - name: Append to step summary
        run: cat .i18n-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing sticky comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- maintainerr-i18n-back-translation -->'
          token: ${{ steps.app-token.outputs.token }}

      - name: Upsert review comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: .i18n-review.md
          edit-mode: replace
          token: ${{ steps.app-token.outputs.token }}
