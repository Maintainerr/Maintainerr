name: Weblate catalog

# Guards the translation catalogs on every pull request: they must be current
# with the source, and no translation may break an ICU placeholder.
#
# The job name is a required status check on development. Renaming it breaks
# branch protection, so leave it alone.
on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Translation catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A Weblate pull request is auto-mergeable after one code-owner approval,
      # so it must not carry anything but translations. Nothing else constrains
      # its diff. This runs inside the already-required check, so it needs no
      # extra branch-protection wiring. Non-Weblate PRs are unaffected and go
      # through normal review.
      - name: Restrict Weblate pull requests to translation catalogs
        env:
          PR_LOGIN: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          from_weblate=false
          case "$PR_LOGIN" in hosted-weblate*) from_weblate=true ;; esac
          case "$HEAD_REF" in weblate-*) from_weblate=true ;; esac
          if [ "$from_weblate" != true ]; then
            echo "Not a Weblate pull request; scope restriction does not apply."
            exit 0
          fi
          outside="$(git diff --name-only "origin/$BASE_REF...HEAD" \
            -- ':!apps/ui/src/locales/**' || true)"
          if [ -n "$outside" ]; then
            echo "::error title=Weblate PR out of scope::A Weblate pull request may only change apps/ui/src/locales/."
            echo "Out-of-scope files:"
            echo "$outside"
            exit 1
          fi
          echo "Weblate pull request is limited to translation catalogs."
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate corepack
        run: |
          corepack install
          corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # node-canvas downloads a prebuilt binary during install and falls back to
      # a source build when that download fails. The runners have no pixman, so
      # the fallback died and took the job with it. These make the fallback work.
      - name: Install node-canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libpixman-1-dev
      - name: Install dependencies
        run: yarn --immutable
      # A PR that adds a translatable string without re-running extraction
      # leaves translators working from a stale catalog.
      - name: Check translation catalog is current
        run: yarn workspace @maintainerr/ui i18n:check
      # Weblate enforces the same placeholder rules when a translation is
      # saved, but that is a setting on someone else's server. This is the
      # copy that runs on our pull requests.
      #
      # Run the validator from the base branch, not the PR: a pull request must
      # not be able to weaken the gate that judges its own catalogs. The .po
      # files stay the PR's (they are the data under test); only the checker is
      # pinned to trusted code. origin/<base> is already local (fetch-depth: 0).
      - name: Validate translation catalogs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LOGIN: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git checkout "origin/$BASE_REF" -- tools/i18n
          # The msgstr-integrity check is on by default (compares against the
          # base branch merge-base). A Weblate sync is the only PR allowed to
          # change translations, so it opts out with --no-base.
          from_weblate=false
          case "$PR_LOGIN" in hosted-weblate*) from_weblate=true ;; esac
          case "$HEAD_REF" in weblate-*) from_weblate=true ;; esac
          if [ "$from_weblate" = true ]; then
            node tools/i18n/validate-catalogs.mjs apps/ui/src/locales --no-base
          else
            node tools/i18n/validate-catalogs.mjs apps/ui/src/locales
          fi
