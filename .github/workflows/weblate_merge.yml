name: Weblate merge

# Merges Weblate's own pull requests once a maintainer approves one, following
# the same shape as dependabot_merge.yml: wait for the required checks, then
# merge as the automation account.
#
# Unlike dependabot, nothing here self-approves. A human still reads the
# translations; the automation only handles the merge, and always as a merge
# commit. Squash and rebase rewrite commit SHAs, after which Weblate stops
# recognising its own commits upstream and every later sync conflicts.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weblate-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge after approval
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'development' &&
      (startsWith(github.event.pull_request.user.login, 'hosted-weblate') ||
       startsWith(github.event.pull_request.head.ref, 'weblate-'))
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_KEY }}

      # An approval from someone without write access carries no authority,
      # and pull_request_review fires for any user who can leave a review.
      - name: Verify the approver can write to this repository
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/${{ github.repository }}/collaborators/${REVIEWER}/permission" \
            --jq .permission)
          echo "${REVIEWER} has ${permission} permission."
          case "$permission" in
            admin|write|maintain) ;;
            *) echo "::notice::Approval from ${REVIEWER} does not carry write access; not merging."
               exit 1 ;;
          esac

      - name: Wait for required checks, then merge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          echo "Waiting for required checks to complete successfully..."
          gh pr checks "$PR_URL" --required --watch

          echo "Required checks passed. Merging as a merge commit..."
          gh pr merge --admin --merge "$PR_URL"
