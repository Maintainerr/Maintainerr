name: Code quality checks

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
      - name: Run yamllint
        run: yamllint -s .

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate corepack
        run: |
          corepack install
          corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # node-canvas downloads a prebuilt binary during install and falls back to
      # a source build when that download fails. The runners have no pixman, so
      # the fallback died and took the job with it. These make the fallback work.
      - name: Install node-canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libpixman-1-dev
      - name: Install dependencies
        run: yarn --immutable
      - name: Check formatting
        run: yarn format:check

  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate corepack
        run: |
          corepack install
          corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # node-canvas downloads a prebuilt binary during install and falls back to
      # a source build when that download fails. The runners have no pixman, so
      # the fallback died and took the job with it. These make the fallback work.
      - name: Install node-canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libpixman-1-dev
      - name: Install dependencies
        run: yarn --immutable
      - name: Run linter
        run: yarn lint

  type-checking:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate corepack
        run: |
          corepack install
          corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      # node-canvas downloads a prebuilt binary during install and falls back to
      # a source build when that download fails. The runners have no pixman, so
      # the fallback died and took the job with it. These make the fallback work.
      - name: Install node-canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libpixman-1-dev
      - name: Install dependencies
        run: yarn --immutable
      - name: Check types
        run: yarn check-types
